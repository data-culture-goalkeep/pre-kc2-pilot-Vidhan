<!doctype html>
<html lang="en">
<head>

  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#183927;background:#f7f8f3;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:#1f5130;color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:12px;padding:4px 9px;font-size:22px;font-weight:800;letter-spacing:-.05em}.brand img{width:43px;height:44px;object-fit:cover}.brand small{display:block;font-size:11px;letter-spacing:.13em;color:#d4e8c2;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{width:100%;border:0;background:transparent;color:#e6f1df;padding:12px 13px;border-radius:11px;text-align:left;font-weight:600}.nav button.active,.nav button:hover{background:#347345;color:#fff}.side-note{margin-top:auto;padding:16px 9px;border-top:1px solid #ffffff39;color:#d4e8c2;font-size:13px;line-height:1.5}.main{min-width:0}.top{height:78px;background:#fff;border-bottom:1px solid #dce4d7;display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:12px}.top span{font-size:13px;color:#68796b}.content{max-width:1370px;margin:auto;padding:30px 34px 70px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:#6d8743}.title{font-size:30px;letter-spacing:-.045em;margin:6px 0 8px}.intro{color:#5a6d5f;margin:0 0 24px;line-height:1.5}.row{display:flex;justify-content:space-between;align-items:center;gap:14px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.field-inline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#41614a}select,input{border:1px solid #ccd8c7;border-radius:9px;padding:10px 12px;background:#fff;color:#183927;min-height:43px}.btn{border:0;background:#245b36;color:#fff;padding:11px 16px;border-radius:9px;font-weight:700}.btn.ghost{background:#fff;border:1px solid #ccd8c7;color:#205233}.card{background:#fff;border:1px solid #dbe4d5;border-radius:16px;box-shadow:0 3px 18px #1e452809}.card-pad{padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.metric-card{padding:18px}.metric-card span{display:block;color:#617263;font-size:13px;margin-bottom:5px}.metric-card small{font-size:12px;color:#6b7b6d}.metric{font-size:31px;font-weight:750;letter-spacing:-.05em}.section-title{font-size:18px;margin:0 0 8px;letter-spacing:-.025em}.muted,.notice{color:#637368;font-size:14px;line-height:1.5}.callout{border-left:4px solid #efc51b;background:#fffae7;padding:13px 15px;border-radius:4px 10px 10px 4px;color:#5e5426;font-size:14px;line-height:1.5}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:12px;color:#708072;text-transform:uppercase;letter-spacing:.07em}td,th{padding:13px 12px;border-bottom:1px solid #e8eee4;vertical-align:middle}td{font-size:14px}.clickable:hover{background:#f4f8ef;cursor:pointer}.text-link{border:0;background:transparent;color:#205b35;text-decoration:underline;text-align:left;padding:0;font-weight:700}.pill{display:inline-block;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#e8f1df;color:#326238}.pill.warn{background:#fff0c4;color:#795900}.pill.grey{background:#edf1ec;color:#53665a}.bar-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 46px;gap:10px;align-items:center;margin:16px 0;font-size:14px}.bar{background:#e8eee3;height:12px;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:10px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}.tabs button{border:1px solid #d5dfcf;background:#fff;border-radius:9px;padding:9px 12px;color:#2c5835;font-weight:650}.tabs button.active{background:#245b36;border-color:#245b36;color:#fff}.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:18px 0}.day{min-height:66px;border:1px solid #dce6d7;border-radius:9px;padding:7px;background:#fff}.day.off{background:#f0f3ed;color:#94a292}.day small{display:block;text-align:center;margin-top:9px}.list{display:grid}.item{padding:15px 0;border-bottom:1px solid #e8eee4}.empty{padding:30px;text-align:center;color:#6b7b6d}.comparison-card{margin:18px 0}.search-field input{min-width:220px}.state-actions{margin-top:18px}.error-state{max-width:760px}.skip-link{position:fixed;left:12px;top:-60px;z-index:99;background:#fff;color:#183927;padding:10px 14px;border-radius:8px;box-shadow:0 4px 18px #0002}.skip-link:focus{top:12px}.top strong{letter-spacing:-.01em}.card{transition:box-shadow .18s ease,border-color .18s ease}.card:hover{border-color:#cad9c4}.nav button{transition:background .16s ease,color .16s ease}.empty{background:#f8faf6;border-radius:10px;margin:10px}.muted small,.item small{display:block;margin-top:4px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #efbf20;outline-offset:2px}
    @media(max-width:1000px){.app{grid-template-columns:190px 1fr}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.app{display:block}.side{padding:10px 14px;gap:8px}.brand{font-size:18px}.brand img{width:31px;height:34px}.side-note{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;font-size:13px;padding:9px}.top{height:auto;padding:13px 17px}.top span{display:none}.content{padding:24px 16px 50px}.title{font-size:25px}.row{align-items:flex-start;flex-wrap:wrap}.bar-row{grid-template-columns:110px 1fr 38px}.month-grid{gap:3px}.day{min-height:56px;padding:4px}}

  <a class="skip-link" href="#view">Skip to workspace</a>

    </main>

  <script src="config.js"></script>
